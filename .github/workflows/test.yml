name: x402 Scraper CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run local server and integration tests
        run: |
          node server.mjs &
          SERVER_PID=$!
          
          # Wait for server to boot up
          sleep 3
          
          # Run integration test against local instance
          TEST_ENDPOINT="http://localhost:3000" node test-integration.js
          
          # Kill background server
          kill $SERVER_PID
