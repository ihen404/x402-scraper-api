name: Daily Telemetry & Revenue Reporting

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Execute Telemetry Collector
        run: node scripts/collect-telemetry.js

      - name: Commit and Push Report
        run: |
          git config --global user.name "x402-telemetry-bot"
          git config --global user.email "bot@x402-scraper.internal"
          git add reports/
          git status
          git diff-index --quiet HEAD || git commit -m "chore(telemetry): update daily analytics report [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
